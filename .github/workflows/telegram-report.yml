name: Telegram report delivery

on:
  workflow_dispatch:
    inputs:
      message:
        description: Message to send for a manual test
        required: false
        default: "Telegram brief delivery test"
  push:
    branches:
      - main
    paths:
      - "logs/**/*.md"
      - "reports/**/*.md"

permissions:
  contents: read

jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Prepare concise brief
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MESSAGE: ${{ inputs.message }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            printf '✅ %s\nRepository: %s\n' "${INPUT_MESSAGE:-Telegram brief delivery test}" "$GITHUB_REPOSITORY" > telegram-message.txt
            exit 0
          fi

          report_file="$(
            git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" |
              grep -E '^(logs|reports)/.*\.md$' |
              head -n 1 || true
          )"

          if [[ -z "$report_file" || ! -f "$report_file" ]]; then
            echo "No changed Markdown report was found."
            exit 1
          fi

          awk '
            /<!-- telegram-brief:start -->/ { capture=1; next }
            /<!-- telegram-brief:end -->/ { capture=0 }
            capture
          ' "$report_file" > telegram-message.txt

          if [[ ! -s telegram-message.txt ]]; then
            echo "The report does not contain a Telegram brief block."
            exit 1
          fi

          head -c 3900 telegram-message.txt > telegram-message.trimmed.txt
          mv telegram-message.trimmed.txt telegram-message.txt

      - name: Send Telegram brief
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail

          if [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_CHAT_ID" ]]; then
            echo "Required Telegram secrets are missing."
            exit 1
          fi

          curl --fail-with-body --silent --show-error --output /tmp/telegram-response.json --request POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text@telegram-message.txt" --data-urlencode "disable_web_page_preview=true"
          echo "Concise Telegram research and contribution brief sent."
